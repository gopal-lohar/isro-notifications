<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISRO Notifications</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>ISRO Notifications</h1>
    </div>
    <nav id="tabs">
      <button data-tab="overview" class="active" type="button">Overview</button>
      <button data-tab="users" type="button">Users</button>
      <button data-tab="updates" type="button">Recent updates</button>
    </nav>
    <button id="theme" class="ghost" type="button">Light</button>
  </header>

  <main>
    <section id="overview">
      <div class="grid">
        <article class="card">
          <p class="label">Status</p>
          <p id="status" class="value">-</p>
        </article>
        <article class="card">
          <p class="label">Last run</p>
          <p id="last-run" class="value small">-</p>
        </article>
        <article class="card">
          <p class="label">Updates sent</p>
          <p id="updates-sent" class="value">0</p>
        </article>
        <article class="card">
          <p class="label">Users</p>
          <p id="user-count" class="value">0</p>
        </article>
      </div>
      <article class="card wide">
        <p class="label">Running since</p>
        <p id="started" class="value small">-</p>
      </article>
    </section>

    <section id="users" hidden>
      <article class="card wide">
        <table>
          <thead>
            <tr><th>Name</th><th>Username</th><th>Chat ID</th><th>Status</th></tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </article>
    </section>

    <section id="updates" hidden>
      <div id="updates-list" class="list"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
